<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JR46 HAIRSTUDIO</title>
<style>
:root{--bg:#f4f2ed;--card:#fff;--tx:#1b1b1f;--mu:#76736b;--bd:#e8e4da;--gold:#c59a3d;--gold2:#e6c473;--hd:#121212;--ok:#2a8a57;--bad:#c0452f;--sh:0 6px 24px rgba(40,30,10,.08);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0e10;--card:#18181b;--tx:#f1efe9;--mu:#a09d94;--bd:#2a2a2e;--hd:#0a0a0a;--ok:#5fbf86;--bad:#e8806e;--sh:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e0e10;--card:#18181b;--tx:#f1efe9;--mu:#a09d94;--bd:#2a2a2e;--hd:#0a0a0a;--ok:#5fbf86;--bad:#e8806e;--sh:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:15px/1.55 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:radial-gradient(900px 360px at 50% -120px,rgba(197,154,61,.22),transparent),var(--bg);min-height:100vh}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;background:var(--hd);color:#f1efe9;border-bottom:2px solid var(--gold)}
header b{letter-spacing:.08em;font-size:15px;color:var(--gold2)}
header .ghost{color:#f1efe9;border-color:rgba(255,255,255,.25)}
nav{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;max-width:960px;margin:0 auto}
nav button{border:1px solid var(--bd);background:var(--card);color:var(--mu);padding:8px 16px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;white-space:nowrap;transition:.15s}
nav button:hover{color:var(--tx);border-color:var(--gold)}
nav button.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;border-color:transparent;font-weight:600;box-shadow:0 4px 14px rgba(197,154,61,.35)}
main{max-width:960px;margin:0 auto;padding:6px 16px 32px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
h1{font-size:24px;margin:0 0 4px;letter-spacing:.06em}h3{margin:0 0 12px;font-size:15px;font-weight:700}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:14px}.g .card{margin:0}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px}.g2 .card{margin:0}
.st{border-left:4px solid var(--gold)}.st span{display:block;color:var(--mu);font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}.st b{display:block;font-size:25px;margin:2px 0}.st small{color:var(--mu)}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mu);font-weight:500}
input,select{width:100%;margin-top:5px;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit;outline:0;transition:.15s}
input:focus,select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(197,154,61,.2)}
.btn{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#1a1405;font-weight:700;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:700;cursor:pointer;box-shadow:0 4px 14px rgba(197,154,61,.3);transition:.15s}
.btn:hover{transform:translateY(-1px)}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:6px 14px;font:inherit;cursor:pointer}
.x{background:none;border:0;color:var(--bad);cursor:pointer;font:inherit;font-size:13px}
.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;border-bottom:1px solid var(--bd);text-align:left;font-size:14px}th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}tbody tr:hover,tr[data-m]:hover{background:rgba(197,154,61,.08)}.r{text-align:right}
.mu{color:var(--mu)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.lg{max-width:380px;margin:9vh auto 0;padding:26px}.lg label{margin-top:14px}.lg .btn{width:100%;margin-top:16px}
.logo{display:block;margin:0 auto 12px;width:124px;height:124px;object-fit:cover;border-radius:50%;border:3px solid var(--gold);box-shadow:0 8px 28px rgba(197,154,61,.35)}
.hb{display:flex;align-items:center;gap:10px}.hl{width:38px;height:38px;border-radius:50%;object-fit:cover;border:2px solid var(--gold)}
.lg h1,.lg>p{text-align:center}
</style></head><body><div id="app"></div>

async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}

function login(){const a=auth();
$('#app').innerHTML=`<div class="lg card"><img class="logo" src="${LOGO}" alt="JR46 Hair Studio"><h1>JR46 HAIRSTUDIO</h1><p class="mu">Khusus pengelola. Masuk untuk melanjutkan.</p><label>Username<input id="u" autocomplete="username"></label><label>Password<input id="p" type="password" autocomplete="current-password"></label><p id="er" class="bad"></p><button class="btn" id="go">Masuk</button></div>`;

['#u','#p'].forEach(s=>$(s).onkeydown=e=>{if(e.key==='Enter')$('#go').click()})}

function app(){if(!inn())return login();
$('#app').innerHTML=`<header><span class="hb"><img class="hl" src="${LOGO}" alt=""><b>JR46 HAIRSTUDIO</b></span><button class="ghost" id="lo">Keluar</button></header><nav>${tabs.map(t=>`<button data-t="${t[0]}" class="${t[0]===tab?'on':''}">${t[1]}</button>`).join('')}</nav><main id="v"></main>`;
$('#lo').onclick=()=>{setIn(false);login()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;app()});
({dash:vDash,kasir:vKasir,cust:vCust,exp:vExp,rep:vRep,set:vSet})[tab]()}

const sum=a=>a.reduce((s,x)=>s+x.price,0);
function shareCard(tx,out){
const pct=D.ks==null?40:D.ks,o={},ns=D.ns2||D.services.map(s=>s.n).concat(D.tx.map(x=>x.svc)).filter(n=>!/^potong rambut/i.test(n));
tx.forEach(x=>{const k=ns.includes(x.svc)?'#':(x.barber||'');o[k]=o[k]||{c:0,s:0};o[k].c++;o[k].s+=x.price});
const rows=Object.entries(o).sort((a,b)=>b[1].s-a[1].s).map(e=>({k:e[0],c:e[1].c,s:e[1].s,kp:(e[0]&&e[0]!=='#')?Math.round(e[1].s*pct/100):0}));
const tot=rows.reduce((a,r)=>({s:a.s+r.s,kp:a.kp+r.kp}),{s:0,kp:0}),bs=tot.s-tot.kp,lb=bs-out;
return `<div class="card" style="margin-top:14px"><h3>Gaji kapster (bagi hasil ${pct}/${100-pct})</h3><label style="max-width:220px">Bagian kapster (%)<input id="ks" type="number" min="0" max="100" value="${pct}"></label><p class="mu">Kapster ${pct}% · Barbershop ${100-pct}%. Transaksi tanpa kapster dan layanan yang tidak dibagi masuk 100% ke barbershop.</p><label>Layanan yang ikut bagi hasil kapster:</label><div style="display:flex;flex-wrap:wrap;gap:8px 16px;margin:6px 0 14px">${D.services.map(s=>`<label style="display:flex;gap:6px;align-items:center;margin:0;color:var(--tx)"><input type="checkbox" class="ns" value="${esc(s.n)}" ${ns.includes(s.n)?'':'checked'} style="width:auto;margin:0;accent-color:#c59a3d">${esc(s.n)}</label>`).join('')}</div><div class="wrap">${rows.length?`<table><tr><th>Kapster</th><th class="r">Transaksi</th><th class="r">Pendapatan</th><th class="r">Gaji kapster (${pct}%)</th><th class="r">Barbershop (${100-pct}%)</th></tr>${rows.map(r=>`<tr><td>${r.k==='#'?'Tidak dibagi (non-kapster)':r.k?esc(r.k):'Tanpa kapster'}</td><td class="r">${r.c}x</td><td class="r">${rp(r.s)}</td><td class="r">${rp(r.kp)}</td><td class="r">${rp(r.s-r.kp)}</td></tr>`).join('')}<tr><th>Total</th><th class="r">${tx.length}x</th><th class="r">${rp(tot.s)}</th><th class="r">${rp(tot.kp)}</th><th class="r">${rp(bs)}</th></tr></table>`:'<p class="mu">Belum ada transaksi bulan ini.</p>'}</div><div class="g" style="margin:14px 0 0"><div class="card st"><span>Total gaji kapster</span><b>${rp(tot.kp)}</b></div><div class="card st"><span>Bagian barbershop</span><b>${rp(bs)}</b></div><div class="card st"><span>Untung bersih barbershop</span><b class="${lb<0?'bad':'ok'}">${rp(lb)}</b><small>bagian barbershop - pengeluaran</small></div></div></div>`}
function svcTbl(cols){
const n=D.services.map(s=>s.n);D.tx.forEach(x=>{if(!n.includes(x.svc))n.push(x.svc)});
const stat=(a,k)=>{const f=a.filter(x=>x.svc===k);return[f.length,sum(f)]};
const last=cols.length-1,rows=n.map(k=>({k,c:cols.map(c=>stat(c[1],k))})).sort((a,b)=>b.c[last][1]-a.c[last][1]);
const cell=(c,t)=>`<${t} class="r">${c[0]}x · ${rp(c[1])}</${t}>`;
return `<div class="wrap"><table><tr><th>Layanan</th>${cols.map(c=>`<th class="r">${esc(c[0])}</th>`).join('')}</tr>${rows.map(r=>`<tr><td>${esc(r.k)}</td>${r.c.map(c=>cell(c,'td')).join('')}</tr>`).join('')}<tr><th>Total</th>${cols.map(c=>cell([c[1].length,sum(c[1])],'th')).join('')}</tr></table></div>`}
function vDash(){const t=today(),m=t.slice(0,7);
const td=D.tx.filter(x=>x.d===t),mo=D.tx.filter(x=>x.d.startsWith(m));
const ex=D.exp.filter(x=>x.d.startsWith(m)).reduce((s,x)=>s+x.amt,0),lb=sum(mo)-ex;
const by=(arr,k)=>{const o={};arr.forEach(x=>{const q=x[k]||'-';o[q]=o[q]||{c:0,s:0};o[q].c++;o[q].s+=x.price});return Object.entries(o).sort((a,b)=>b[1].s-a[1].s)};
const tb=a=>a.length?`<table>${a.map(e=>`<tr><td>${esc(e[0])}</td><td>${e[1].c}x</td><td class="r">${rp(e[1].s)}</td></tr>`).join('')}</table>`:'<p class="mu">Belum ada data.</p>';
$('#v').innerHTML=`<div class="card" style="background:var(--hd);color:#f1efe9;border:0;border-left:4px solid var(--gold)"><span style="color:var(--gold2);font-size:12.5px;letter-spacing:.1em;text-transform:uppercase">Selamat Datang</span><div style="font-size:19px;font-weight:700;margin-top:2px">Bapak Owner Fikri Rahmat Dani, SH., MH.,CPHR.,CBA</div></div><div class="g"><div class="card st"><span>Pendapatan hari ini</span><b>${rp(sum(td))}</b><small>${td.length} pelanggan</small></div><div class="card st"><span>Pendapatan bulan ini</span><b>${rp(sum(mo))}</b><small>${mo.length} transaksi</small></div><div class="card st"><span>Pengeluaran bulan ini</span><b>${rp(ex)}</b></div><div class="card st"><span>Laba bulan ini</span><b class="${lb<0?'bad':'ok'}">${rp(lb)}</b></div></div><div class="g2"><div class="card"><h3>Kapster hari ini</h3>${tb(by(td,'barber'))}</div><div class="card"><h3>Layanan terlaris bulan ini</h3>${tb(by(mo,'svc'))}</div></div><div class="card" style="margin-top:14px"><h3>Pendapatan per layanan</h3>${svcTbl([['Hari ini',td],['Bulan ini',mo]])}</div>`}

function vKasir(){const t=today();
const tl=D.tx.map((x,i)=>[x,i]).filter(e=>e[0].d===t).reverse();
$('#v').innerHTML=`<div class="card"><h3>Transaksi baru</h3><div class="f"><label>Layanan<select id="s">${D.services.map((s,i)=>`<option value="${i}">${esc(s.n)}</option>`).join('')}</select></label><label>Harga (Rp)<input id="pr" type="number" min="0" placeholder="Isi harga"></label><label>Kapster<select id="b"><option value="">-</option>${D.barbers.map(b=>`<option>${esc(b)}</option>`).join('')}</select></label><label>Pelanggan<input id="c" list="cl" placeholder="Opsional"></label><datalist id="cl">${D.customers.map(c=>`<option value="${esc(c.n)}">`).join('')}</datalist><label>Pembayaran<select id="pm"><option>Tunai</option><option>QRIS</option><option>Transfer</option></select></label></div><button class="btn" id="sv">Simpan transaksi</button> <span id="ms" class="mu"></span></div><div class="card"><h3>Transaksi hari ini (${tl.length})</h3><div class="wrap">${tl.length?`<table><tr><th>Layanan</th><th>Kapster</th><th>Pelanggan</th><th>Bayar</th><th class="r">Harga</th><th></th></tr>${tl.map(e=>`<tr><td>${esc(e[0].svc)}</td><td>${esc(e[0].barber||'-')}</td><td>${esc(e[0].cust||'-')}</td><td>${esc(e[0].pay)}</td><td class="r">${rp(e[0].price)}</td><td><button class="x" data-k="tx" data-i="${e[1]}">Hapus</button></td></tr>`).join('')}</table>`:'<p class="mu">Belum ada transaksi.</p>'}</div></div>`;
const sp=()=>{const s=D.services[$('#s').value];$('#pr').value=s?s.p:''};sp();$('#s').onchange=sp;
$('#sv').onclick=()=>{const s=D.services[$('#s').value];if(!s){$('#ms').textContent='Tambah layanan dulu di Pengaturan.';return}
const price=+$('#pr').value,c=$('#c').value.trim();if(isNaN(price)||price<=0){$('#ms').textContent='Isi harga terlebih dahulu.';return}
D.tx.push({d:today(),svc:s.n,price,barber:$('#b').value,cust:c,pay:$('#pm').value});
if(c&&!D.customers.some(x=>x.n.toLowerCase()===c.toLowerCase()))D.customers.push({n:c,hp:''});
save();vKasir();$('#ms').textContent='Tersimpan.'};
del()}

function vCust(){
const st=n=>{const a=D.tx.filter(x=>(x.cust||'').toLowerCase()===n.toLowerCase());return[a.length,sum(a),a.length?a[a.length-1].d:'-']};
$('#v').innerHTML=`<div class="card"><h3>Tambah pelanggan</h3><div class="f"><label>Nama<input id="n"></label><label>No. WhatsApp<input id="h" inputmode="tel"></label></div><button class="btn" id="ad">Tambah</button></div><div class="card"><h3>Daftar pelanggan (${D.customers.length})</h3><div class="wrap">${D.customers.length?`<table><tr><th>Nama</th><th>WhatsApp</th><th>Kunjungan</th><th>Terakhir</th><th class="r">Total</th><th></th></tr>${D.customers.map((c,i)=>{const s=st(c.n);return`<tr><td>${esc(c.n)}</td><td>${esc(c.hp||'-')}</td><td>${s[0]}x</td><td>${s[2]}</td><td class="r">${rp(s[1])}</td><td><button class="x" data-k="customers" data-i="${i}">Hapus</button></td></tr>`}).join('')}</table>`:'<p class="mu">Belum ada pelanggan.</p>'}</div></div>`;
$('#ad').onclick=()=>{const n=$('#n').value.trim();if(!n)return;D.customers.push({n,hp:$('#h').value.trim()});save();vCust()};del()}

function vExp(){const l=D.exp.map((x,i)=>[x,i]).sort((a,b)=>b[0].d.localeCompare(a[0].d));
$('#v').innerHTML=`<div class="card"><h3>Catat pengeluaran</h3><div class="f"><label>Tanggal<input id="d" type="date" value="${today()}"></label><label>Keterangan<input id="k" placeholder="Beli pomade, listrik, dll"></label><label>Jumlah (Rp)<input id="a" type="number" min="0"></label></div><button class="btn" id="ad">Simpan</button></div><div class="card"><h3>Riwayat pengeluaran</h3><div class="wrap">${l.length?`<table>${l.map(e=>`<tr><td>${esc(e[0].d)}</td><td>${esc(e[0].note)}</td><td class="r">${rp(e[0].amt)}</td><td><button class="x" data-k="exp" data-i="${e[1]}">Hapus</button></td></tr>`).join('')}</table>`:'<p class="mu">Belum ada pengeluaran.</p>'}</div></div>`;
$('#ad').onclick=()=>{const amt=+$('#a').value,note=$('#k').value.trim();if(!amt||!note||!$('#d').value)return;D.exp.push({d:$('#d').value,note,amt});save();vExp()};del()}

function vSet(){
$('#v').innerHTML=`<div class="g2"><div class="card"><h3>Layanan &amp; harga</h3><table>${D.services.map((s,i)=>`<tr><td>${esc(s.n)}</td><td class="r">${rp(s.p)}</td><td><button class="x" data-k="services" data-i="${i}">Hapus</button></td></tr>`).join('')}</table><div class="f" style="margin-top:12px"><label>Nama<input id="sn"></label><label>Harga<input id="sp" type="number" min="0"></label></div><button class="btn" id="as">Tambah layanan</button></div><div class="card"><h3>Kapster</h3><table>${D.barbers.map((b,i)=>`<tr><td>${esc(b)}</td><td class="r"><button class="x" data-k="barbers" data-i="${i}">Hapus</button></td></tr>`).join('')||'<tr><td class="mu">Belum ada kapster.</td></tr>'}</table><div class="f" style="margin-top:12px"><label>Nama kapster<input id="bn"></label></div><button class="btn" id="ab">Tambah kapster</button></div></div><div class="card" style="margin-top:14px"><h3>Ganti password</h3><div class="f"><label>Password baru<input id="np" type="password"></label></div><button class="btn" id="cp">Simpan password</button> <span id="pm" class="mu"></span><p class="mu">Catatan: data dan akun tersimpan di browser perangkat ini saja, dan login ini bukan pengaman tingkat server.</p></div>`;
$('#as').onclick=()=>{const n=$('#sn').value.trim(),p=+$('#sp').value;if(!n||p<0)return;D.services.push({n,p});save();vSet()};
$('#ab').onclick=()=>{const n=$('#bn').value.trim();if(!n)return;D.barbers.push(n);save();vSet()};
$('#cp').onclick=async()=>{const p=$('#np').value,a=auth();if(p.length<4){$('#pm').textContent='Minimal 4 karakter.';return}
a.h=await sha(a.u+':'+p);try{localStorage.setItem('bs_auth',JSON.stringify(a))}catch(e){}$('#pm').textContent='Password diganti.'};del()}

let rm=today().slice(0,7);
function vRep(){
const tx=D.tx.filter(x=>x.d.startsWith(rm)),ex=D.exp.filter(x=>x.d.startsWith(rm));
const inc=sum(tx),out=ex.reduce((s,x)=>s+x.amt,0),lb=inc-out;
const add=(o,k,f,v)=>{o[k]=o[k]||{i:0,o:0};o[k][f]+=v};
const days={};tx.forEach(x=>add(days,x.d,'i',x.price));ex.forEach(x=>add(days,x.d,'o',x.amt));
const ms={};D.tx.forEach(x=>add(ms,x.d.slice(0,7),'i',x.price));D.exp.forEach(x=>add(ms,x.d.slice(0,7),'o',x.amt));
ms[rm]=ms[rm]||{i:0,o:0};
const pay={};tx.forEach(x=>pay[x.pay]=(pay[x.pay]||0)+x.price);
const lbl=m=>new Date(m+'-01T00:00').toLocaleDateString('id-ID',{month:'long',year:'numeric'});
const row=(a,o,at)=>`<tr ${at||''}><td>${esc(a)}</td><td class="r">${rp(o.i)}</td><td class="r">${rp(o.o)}</td><td class="r ${o.i-o.o<0?'bad':'ok'}">${rp(o.i-o.o)}</td></tr>`;
const hd=k=>`<tr><th>${k}</th><th class="r">Pemasukan</th><th class="r">Pengeluaran</th><th class="r">Selisih</th></tr>`;
$('#v').innerHTML=`<div class="card"><label style="max-width:220px">Pilih bulan<input id="mm" type="month" value="${rm}"></label></div><div class="g"><div class="card st"><span>Pemasukan ${esc(lbl(rm))}</span><b>${rp(inc)}</b><small>${tx.length} transaksi</small></div><div class="card st"><span>Pengeluaran</span><b>${rp(out)}</b><small>${ex.length} catatan</small></div><div class="card st"><span>Laba bersih</span><b class="${lb<0?'bad':'ok'}">${rp(lb)}</b></div></div><div class="g2"><div class="card"><h3>Per hari</h3><div class="wrap">${Object.keys(days).length?`<table>${hd('Tanggal')}${Object.keys(days).sort().map(d=>row(d,days[d])).join('')}</table>`:'<p class="mu">Belum ada data bulan ini.</p>'}</div></div><div class="card"><h3>Pemasukan per metode bayar</h3>${Object.keys(pay).length?`<table>${Object.entries(pay).map(e=>`<tr><td>${esc(e[0])}</td><td class="r">${rp(e[1])}</td></tr>`).join('')}</table>`:'<p class="mu">Belum ada data.</p>'}<h3 style="margin-top:16px">Rincian pengeluaran</h3>${ex.length?`<table>${ex.slice().sort((a,b)=>a.d.localeCompare(b.d)).map(x=>`<tr><td>${esc(x.d)}</td><td>${esc(x.note)}</td><td class="r">${rp(x.amt)}</td></tr>`).join('')}</table>`:'<p class="mu">Belum ada pengeluaran.</p>'}</div></div><div class="card" style="margin-top:14px"><h3>Pendapatan per layanan - ${esc(lbl(rm))}</h3>${svcTbl([['Pemasukan',tx]])}</div>${shareCard(tx,out)}<div class="card" style="margin-top:14px"><h3>Rekap semua bulan (klik untuk melihat detail)</h3><div class="wrap"><table>${hd('Bulan')}${Object.keys(ms).sort().reverse().map(m=>row(lbl(m),ms[m],`data-m="${m}" style="cursor:pointer"`)).join('')}</table></div></div>`;
$('#mm').onchange=e=>{if(e.target.value){rm=e.target.value;vRep()}};
$('#ks').onchange=e=>{let v=+e.target.value;if(isNaN(v)||v<0)v=0;if(v>100)v=100;D.ks=v;save();vRep()};
document.querySelectorAll('.ns').forEach(c=>c.onchange=()=>{D.ns2=[...document.querySelectorAll('.ns:not(:checked)')].map(x=>x.value);save();vRep()});
document.querySelectorAll('tr[data-m]').forEach(r=>r.onclick=()=>{rm=r.dataset.m;vRep();window.scrollTo(0,0)})}

function del(){document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(!confirm('Hapus data ini?'))return;D[b.dataset.k].splice(+b.dataset.i,1);save();app()})}
app();
</script></body></html>
